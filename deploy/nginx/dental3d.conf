# Dental-3D — nginx en el servidor propio.
# Cada sucursal es un subdominio: central.dental3d.com, sur.dental3d.com…
# El frontend y la API se sirven desde el MISMO host: la API (tenancy-node) reconoce la
# sucursal por el Host, así que nginx debe pasar el Host original (proxy_set_header Host $host).
#
# Reemplaza dental3d.com por tu dominio. Necesitas un registro DNS comodín (*.dental3d.com → IP
# del servidor) y un certificado comodín (ver DEPLOY.md, paso 7).

upstream dental3d_api { server 127.0.0.1:4000; keepalive 16; }
upstream dental3d_web { server 127.0.0.1:3000; keepalive 16; }

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dental3d.com *.dental3d.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dental3d.com *.dental3d.com;

    ssl_certificate     /etc/letsencrypt/live/dental3d.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dental3d.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Ojo: un add_header dentro de un "location" anula estos. Los archivos /assets/* ya llegan
    # con caché de 1 año desde el frontend (tienen hash en el nombre), no hace falta repetirla aquí.

    # Comprobantes de hasta 5 MB (la API rechaza lo que pase de ese límite)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API y rutas públicas de tenancy-node (/tenancy/me, theme.css, assets del logo)
    location ~ ^/(api|tenancy)/ {
        proxy_pass http://dental3d_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;                 # ← la sucursal sale de aquí
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Panel de la plataforma (tenancy-node): crear sucursales, tema, "Entrar como…".
    # Solo responde en el dominio central (en una sucursal da 404). El propio módulo recomienda no
    # dejarlo abierto a internet: limita las IP que pueden entrar (oficina, VPN).
    # Con TRUST_PROXY=1 en la API, su límite de intentos de login ve la IP real (X-Forwarded-For).
    location /admin/ {
        allow 127.0.0.1;
        # allow 203.0.113.10;        # ← IP de tu oficina o VPN
        deny all;
        proxy_pass http://dental3d_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El progreso en vivo de "crear sucursal" usa Server-Sent Events
        proxy_buffering off;
        proxy_read_timeout 15m;
    }

    # El health check con detalles no se expone a internet
    location = /api/health { allow 127.0.0.1; deny all; proxy_pass http://dental3d_api; }

    # Todo lo demás: frontend (TanStack Start, servidor Node)
    location / {
        proxy_pass http://dental3d_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
