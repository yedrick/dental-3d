# nginx para las pruebas locales: las mismas rutas que deploy/nginx/dental3d.conf, pero en HTTP
# (puerto 8088) y con *.localhost. Lo levanta correr.sh en Docker (red del host).
worker_processes auto;
events { worker_connections 8192; }
http {
    upstream dental3d_api { server 127.0.0.1:4000; keepalive 64; }
    upstream dental3d_web { server 127.0.0.1:3000; keepalive 64; }
    access_log off;

    server {
        listen 8088;
        listen [::]:8088;
        server_name localhost *.localhost;
        client_max_body_size 6m;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        location ~ ^/(api|tenancy)/ {
            proxy_pass http://dental3d_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://dental3d_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
